<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140d22">
<title>Los Pedazos de J</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#140d22;--panel:#231838;--ink:#f6efff;--muted:#b9a8d6;--acc:#ff5c9a;--gold:#ffd166;--ok:#5be3a0;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
.box,.box *,#fin,#fin *,#tele,#tele *{touch-action:pan-y}
.box{overscroll-behavior:contain}
#fin{overflow-y:auto;-webkit-overflow-scrolling:touch}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(#0b0714dd,#0b071400);pointer-events:none}
header>*{pointer-events:auto}
header .room{flex:1;font-weight:600;font-size:15px;color:#e6dbff;text-shadow:0 1px 4px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.chip{background:#231838cc;border:1px solid #4a3770;border-radius:999px;padding:6px 11px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;backdrop-filter:blur(4px)}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#inv{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;gap:6px;justify-content:center;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#0b071400,#0b0714dd);pointer-events:none}
.slot{flex:0 0 50px;height:50px;border-radius:12px;background:#231838cc;border:2px solid #4a3770;display:flex;align-items:center;justify-content:center;font-size:25px;position:relative;cursor:pointer;pointer-events:auto}
.slot.sel{border-color:var(--gold);box-shadow:0 0 12px #ffd16688}
.slot small{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:700;color:var(--gold)}
.slot.empty{opacity:.3;pointer-events:none}
#toast{position:absolute;left:50%;top:62px;transform:translateX(-50%) translateY(-20px);background:#000c;border:1px solid #ffffff22;padding:9px 14px;border-radius:12px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center;z-index:7}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s;z-index:8}
#fade.on{opacity:1}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid #ffffff44;background:#ffffff10;display:none;pointer-events:none;z-index:5}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#ffffff55;box-shadow:0 0 12px #fff6}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff8;pointer-events:none;z-index:5}
#exitFocus{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:7;display:none}
#focusHelp{position:absolute;left:50%;top:60px;transform:translateX(-50%);z-index:6;display:none;background:#000a;padding:8px 14px;border-radius:12px;font-size:14px;text-align:center;width:max-content;max-width:90%}
#modal{position:fixed;inset:0;background:#07040ecc;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.on{display:flex}
.box{background:var(--panel);border:1px solid #4a3770;border-radius:20px;padding:18px;width:100%;max-width:420px;max-height:92vh;max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;text-align:center;animation:pop .22s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.box h2{margin:0 0 10px;font-size:20px}
.box p{margin:8px 0;line-height:1.45;color:#e8dcff}
.btn{display:inline-block;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:11px 20px;font:600 16px Fredoka,sans-serif;margin:6px 4px;cursor:pointer}
.btn.sec{background:#3a2a57}
.letter{background:#fff7e6;color:#4a2c1a;font-family:Caveat,cursive;font-size:23px;text-align:left;padding:18px 20px;border-radius:6px;line-height:1.25;box-shadow:inset 0 0 30px #e8c99a;transform:rotate(-1deg)}
.mirrortext{font-family:Caveat,cursive;font-size:30px;color:#cfe8ff;transform:scaleX(-1);padding:18px;background:radial-gradient(#9fc3e655,#30486555);border-radius:50%/40%;border:4px solid #b9c7d6;line-height:1.15;text-shadow:0 0 6px #fff8}
.lock{display:flex;gap:8px;justify-content:center;margin:12px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:4px}
.wheel button{width:52px;height:38px;border-radius:10px;border:0;background:#3a2a57;color:#fff;font-size:18px;cursor:pointer}
.wheel div{width:52px;height:60px;border-radius:10px;background:#0d0817;border:2px solid #b08d57;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:var(--gold)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#wake{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden}
#wake .lid{position:absolute;left:-15%;width:130%;height:60%;background:#000;transition:none}
#wake .top{top:0;border-radius:0 0 50% 50%/0 0 45% 45%;box-shadow:0 18px 40px 26px #000}
#wake .bot{bottom:0;border-radius:50% 50% 0 0/45% 45% 0 0;box-shadow:0 -18px 40px 26px #000}
#wake .wtxt{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:700 30px Caveat,cursive;color:#fff;text-shadow:0 0 12px #000;opacity:0;transition:opacity .7s}
body.waking>*:not(#app):not(#wake):not(#intro),body.waking #app>*:not(#stage){visibility:hidden}
#intro{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#intro .line{font-size:22px;opacity:0;transition:opacity 1.2s;min-height:34px;color:#d9c8ff}
#intro .line.on{opacity:1}
#intro h1{font-size:40px;margin:10px 0 4px;letter-spacing:1px;background:linear-gradient(90deg,#ff7eb6,#ffd166,#9d7bff);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;transition:opacity 1.5s}
#intro .sub{color:var(--muted);opacity:0;transition:opacity 1.5s .4s}
#intro .go{opacity:0;transition:opacity 1s .8s;margin-top:22px}
#intro.show h1,#intro.show .sub,#intro.show .go{opacity:1}
#loading{font-size:14px;color:#8a78a8;margin-top:14px}
#jumpBtn{position:absolute;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:6;width:78px;height:78px;border-radius:50%;border:2px solid #ffffff55;background:radial-gradient(#9d7bffaa,#4a2b8acc);color:#fff;font:700 15px Fredoka,sans-serif;display:none;box-shadow:0 0 18px #9d7bff88}
#jumpBtn:active{transform:scale(.92)}
#parts{display:none}
#tele{position:fixed;inset:0;z-index:15;background:radial-gradient(#0a0620f5,#000f);display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}
#tele h2{margin:0 0 4px}
#tele p{margin:4px 0 10px;color:#d9c8ff;min-height:22px}
#teleSvg{width:min(94vw,62vh);height:min(94vw,62vh);border-radius:50%;background:radial-gradient(#1a1240,#05030f 72%);box-shadow:0 0 0 6px #c9a24a,0 0 40px #6b4cff66}
#fin{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#3a1f66ee,#140d22f5 70%)}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <header>
    <span class="chip" id="timer">⏱ 00:00</span>
    <span class="room" id="roomName"></span>
    <span class="chip" id="parts">🧩 0/7</span>
    <span class="chip" id="hintBtn">💡 3</span>
    <span class="chip" id="menuBtn">☰</span>
  </header>
  <div id="cross"></div>
  <div id="joy"><i></i></div>
  <div id="toast"></div>
  <div id="focusHelp"></div>
  <button class="btn sec" id="exitFocus">✕ Salir del panel</button>
  <button id="jumpBtn">⤴<br>SALTAR</button>
  <div id="inv"></div>
  <div id="fin"></div>
  <div id="tele"><h2>🔭 El telescopio</h2><p id="teleMsg">Une las estrellas para formar nuestras iniciales</p><svg id="teleSvg" viewBox="0 0 100 100"></svg>
    <div><button class="btn sec" id="teleClr">Borrar línea</button><button class="btn sec" id="teleX">Salir</button></div></div>
  <div id="fade"></div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="intro"><div id="loading">Cargando…</div></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

// ================== DATOS PERSONALES ==================
const P = { ella:'Sara', apodo:'Amorsh', yo:'J', codigoFecha:'0108' };

// ================== ESTADO ==================
const KEY='pedazos-de-j-3d-v1';
const FRESH=()=>({started:false, inv:[], f:{}, t:0, hints:3, mir:Array(11).fill(0), mix:[], pos:[0,2.6,0], world:'casa', sp:null, parts:[]});
let S=FRESH(), sel=null;
if (/[?&]reset=1/.test(location.search)) { try{localStorage.removeItem(KEY)}catch(e){} }
try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.started) S=Object.assign(FRESH(),d); }catch(e){}
let WORLD=S.world||'casa', SP=null; const activeScene=()=>(GW&&GW[WORLD])?GW[WORLD].scene:WORLD==='espacio'?space:WORLD==='bosque'?forest:WORLD==='mar'?sea:WORLD==='dulces'?candy:scene;
function save(){ S.pos=[+player.x.toFixed(2),+player.z.toFixed(2),+yaw.toFixed(2)]; if(SP&&WORLD==='espacio'&&SP.last) S.sp=[SP.x,SP.y,SP.z].map(v=>+v.toFixed(2)); if(WORLD==='bosque'&&typeof FP!=='undefined') S.fp=[FP.x,FP.z,yaw].map(v=>+v.toFixed(2)); if(WORLD==='mar'&&typeof MP!=='undefined') S.mp=[MP.x,MP.z,yaw].map(v=>+v.toFixed(2)); if(WORLD==='dulces'&&typeof DP!=='undefined') S.dp=[...DP.safe,yaw].map(v=>+v.toFixed(2)); if(GW&&GW[WORLD]){ S.wp=S.wp||{}; S.wp[WORLD]=[...GW[WORLD].P.safe,yaw].map(v=>+v.toFixed(2)); } try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }

const ITEMS={
  carta:{e:'✉️',n:'Carta de J',d:'La carta que te dejé.'},
  llaveA:{e:'🗝️',b:'½',n:'Mitad de llave (cabeza)',d:'Le falta la otra parte.'},
  llaveB:{e:'🔩',b:'½',n:'Mitad de llave (punta)',d:'Parece la punta de una llave.'},
  llave:{e:'🗝️',n:'Llave dorada',d:'Ya está completa. ¿Qué abrirá?'},
  amarillo:{e:'🧪',n:'Frasco amarillo',d:'Brilla como el sol. Huele a magia.'},
};
const has=id=>S.inv.includes(id);
function give(id,quiet){ if(!has(id)) S.inv.push(id); sfx('item'); renderInv(); save(); if(!quiet) toast('Conseguiste: '+ITEMS[id].e+' '+ITEMS[id].n); }
function take(id){ S.inv=S.inv.filter(x=>x!==id); if(sel===id) sel=null; renderInv(); save(); }

// ================== SONIDO ==================
let AC=null;
function sfx(type){
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const seq={tap:[[520,.05]],item:[[660,.08],[880,.08],[1320,.14]],bad:[[200,.12],[150,.2]],ok:[[523,.1],[659,.1],[784,.1],[1047,.25]],
    open:[[300,.08],[450,.08],[700,.15]],pour:[[400,.06],[480,.06],[560,.08]],puff:[[120,.25]],magic:[[784,.1],[988,.1],[1175,.1],[1568,.3]],
    creak:[[90,.35],[70,.3]],click:[[1200,.03],[800,.03]],step:[[90,.04]],jump:[[330,.06],[520,.09]],land:[[110,.07]]}[type]||[[440,.05]];
  let t=AC.currentTime;
  for(const [f,d] of seq){ const o=AC.createOscillator(),g=AC.createGain();
    o.type=(type==='bad'||type==='puff'||type==='creak')?'sawtooth':'triangle'; o.frequency.value=f;
    const v=type==='step'?.04:.12; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02); t+=d*.9; }
}

// ================== UI ==================
const $=s=>document.querySelector(s);
let toastT;
function toast(msg,ms=2600){ const el=$('#toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),ms); }
function modal(html,onReady){ $('#mbox').innerHTML=html; $('#modal').classList.add('on'); if(onReady) onReady($('#mbox')); }
function closeModal(){ $('#modal').classList.remove('on'); }
window.closeModal=closeModal;
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
const modalOpen=()=>$('#modal').classList.contains('on');
function say(title,text,btn='OK'){ modal(`<h2>${title}</h2><p>${text}</p><button class="btn" onclick="closeModal()">${btn}</button>`); }
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');

function renderInv(){
  let h='';
  for(let i=0;i<Math.max(5,S.inv.length);i++){ const id=S.inv[i];
    if(!id){ h+='<div class="slot empty"></div>'; continue; }
    const it=ITEMS[id]; h+=`<div class="slot ${sel===id?'sel':''}" data-item="${id}">${it.e}${it.b?`<small>${it.b}</small>`:''}</div>`; }
  $('#inv').innerHTML=h;
}
$('#inv').addEventListener('click',e=>{
  const s=e.target.closest('[data-item]'); if(!s) return; const id=s.dataset.item; sfx('tap');
  if(sel&&sel!==id){ combine(sel,id); return; }
  if(sel===id){ examine(id); return; }
  sel=id; renderInv(); toast(ITEMS[id].n+' — tócalo otra vez para verlo, o toca algo del cuarto para usarlo');
});
function examine(id){ if(id==='carta') return showLetter(); if(id==='flauta') return openFlute(false); const it=ITEMS[id]; say(it.e+' '+it.n,it.d); }
function combine(a,b){
  if([a,b].sort().join('+')==='llaveA+llaveB'){ take('llaveA'); take('llaveB'); sel=null; sfx('ok'); give('llave',true);
    say('🗝️ ¡Encajaron!','Las dos mitades hicieron <b>clic</b>. Ahora tienes una llave dorada completa.'); return; }
  sfx('bad'); toast('Eso no se puede juntar'); sel=null; renderInv();
}
setInterval(()=>{ if(!S.started||S.f.gano||$('#fin').style.display==='flex'||document.hidden) return; S.t++; $('#timer').textContent='⏱ '+fmt(S.t); if(S.t%5===0) save(); },1000);

function roomOf(z){ return z>-4?'entrada':z>-12?'espejos':'lab'; }
const ROOMNAME={entrada:'🏠 La Entrada',espejos:'🪞 Cuarto de Espejos',lab:'🧪 Laboratorio'};
function hintText(){
  if(WORLD==='espacio') return spaceHint(); if(WORLD==='bosque') return forestHint(); if(WORLD==='mar') return seaHint(); if(WORLD==='dulces') return dulcesHint(); if(GW&&GW[WORLD]) return GW[WORLD].hint();
  const f=S.f, r=roomOf(player.z);
  if(r==='entrada'){
    if(!f.carta) return 'Empieza por la carta que está en el piso. Busca los brillitos ✦.';
    if(!f.luz&&!f.cofre) return 'Está muy oscuro… prende la lámpara de pie. Después mira el calendario de la pared.';
    if(!f.cofre) return 'El cofre pide 4 números: el DÍA y el MES en que empezó lo de ustedes (como dice la carta).';
    if(!f.cuadro) return 'Una media llave no abre nada. Hay un cuadro en la pared que no está derecho…';
    if(!has('llave')&&!f.puerta) return 'Toca una mitad de la llave abajo en el inventario y después la otra para unirlas.';
    return 'Selecciona la llave abajo y toca la puerta.';
  }
  if(r==='espejos'){
    if(!f.laser) return 'Toca la mesa del centro. Gira los espejos para que la luz salga justo donde está el OJO. Ojo: TODOS los espejos se usan.';
    if(!f.caja) return 'La caja de cristal ya se abrió. Revisa qué hay adentro.';
    return 'La puerta del fondo ya está abierta. Y no olvides leer el espejo grande, es importante.';
  }
  if(!f.estante) return 'Falta un color en el estante… el que sacaste de la caja de espejos.';
  if(!f.portal) return 'El espejo grande decía que la pizarra miente: léela al revés, de derecha a izquierda.';
  return '¡Camina hacia el portal!';
}
$('#hintBtn').onclick=()=>{
  sfx('tap');
  if(S.hints<=0) return say('💡 Sin pistas','Ya usaste tus 3 pistas. ¡Ahora todo depende de ti, '+P.apodo+'!');
  modal(`<h2>💡 ¿Usar una pista?</h2><p>Solo tienes <b>${S.hints}</b> en todo el juego. Úsalas con cuidado.</p>
    <button class="btn" id="hy">Sí, dame una</button><button class="btn sec" onclick="closeModal()">Mejor no</button>`,b=>{
    b.querySelector('#hy').onclick=()=>{ S.hints--; save(); updHud(); say('💡 Pista',hintText()); };
  });
};
$('#menuBtn').onclick=()=>{
  sfx('tap');
  modal(`<h2>☰ Menú</h2><p>Tiempo: <b>${fmt(S.t)}</b> · Pistas: <b>${S.hints}</b></p>
   <p style="font-size:14px">🕹️ Dedo izquierdo: caminar · Dedo derecho: mirar · Toca las cosas para usarlas</p>
   <button class="btn" onclick="closeModal()">Seguir jugando</button><br><button class="btn sec" id="rs">Empezar de cero</button>`,b=>{
    b.querySelector('#rs').onclick=()=>modal(`<h2>¿Seguro?</h2><p>Se borra todo tu avance.</p><button class="btn" id="rs2">Sí, borrar</button><button class="btn sec" onclick="closeModal()">No</button>`,b2=>{
      b2.querySelector('#rs2').onclick=()=>{ try{localStorage.removeItem(KEY)}catch(e){} location.href=location.pathname; };
    });
  });
};
function updHud(){ $('#hintBtn').textContent='💡 '+S.hints; $('#timer').textContent='⏱ '+fmt(S.t); $('#roomName').textContent=(GW&&GW[WORLD])?GW[WORLD].title:WORLD==='espacio'?'🌌 El Espacio':WORLD==='bosque'?'🌲 Bosque Mágico':WORLD==='mar'?'🌊 Bajo el Mar':WORLD==='dulces'?'🍭 Mundo de Dulces':ROOMNAME[roomOf(player.z)];
  $('#parts').textContent='🧩 '+S.parts.length+'/7'; $('#parts').style.display=(S.parts.length||WORLD!=='casa')?'inline-block':'none';
  $('#jumpBtn').style.display=(WORLD==='espacio'||WORLD==='dulces'||(GW&&GW[WORLD]&&GW[WORLD].jump))?'block':'none'; }
function showLetter(){
  modal(`<div class="letter">${P.apodo}:<br><br>
  Si estás leyendo esto es porque algo raro pasó… Me rompí en pedazos y quedé regado por mundos muy lejanos. 💔<br><br>
  Solo tú puedes encontrar mis partes y armarme otra vez. No va a ser fácil, pero yo sé que tú puedes.<br><br>
  Para salir de aquí, empieza por <b>lo primero</b>: el día en que empezó lo nuestro.<br>
  <span style="font-size:19px">(Día y mes. Cuatro números.)</span><br><br>
  Al final te espera algo… 🎁<br>— ${P.yo} ❤️</div>
  <button class="btn" onclick="closeModal()">Guardar carta</button>`);
}

// ================== 3D BASE ==================
await Promise.race([Promise.all([document.fonts.load('40px Caveat'),document.fonts.load('700 40px Caveat'),document.fonts.load('600 40px Fredoka')]),new Promise(r=>setTimeout(r,2500))]).catch(()=>{});
const stage=$('#stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
renderer.outputColorSpace=THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x05030a); scene.fog=new THREE.Fog(0x05030a,9,24);
const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(72,1,0.05,1000); camera.rotation.order='YXZ';
function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w<h?78:65; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

const M=(c,o={})=>{ const m=new THREE.MeshStandardMaterial({color:c,roughness:o.r??.8,metalness:o.m??0,map:o.map||null,emissive:o.e??0,emissiveIntensity:o.ei??1,transparent:!!o.tr,opacity:o.op??1,side:o.side??THREE.FrontSide,depthWrite:o.dw??true}); m.envMapIntensity=o.env??.35; return m; };
const B=(w,h,d,mat,x=0,y=0,z=0,par=scene)=>{ const me=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); me.position.set(x,y,z); par.add(me); return me; };

  if(!animate){ frame.position.set(end.x,end.y,-1); frame.rotation.x=end.rx; frame.rotation.z=end.rz; return; }
  const y0=frame.position.y, x0=frame.position.x, z0=frame.rotation.z;
  anim(.75,t=>{ const k=t*t; frame.position.y=y0+(end.y-y0)*k; frame.position.x=x0+(end.x-x0)*t; frame.rotation.x=end.rx*ease(t); frame.rotation.z=z0+(end.rz-z0)*t; },()=>{ sfx('bad'); for(let i=0;i<14;i++) emit(new THREE.Vector3(3.55,.05,-1),{color:0xbba890,normal:true,vel:[0,.5,0],spread:.8,life:.8,size:.08,op:.5}); }); }

const FORMULA=['amarillo','azul','verde','rojo'];
function pourAnim(c){
  if(S.f.portal) return toast('El portal ya está abierto.');
  const b=BOT[c]; busy=true; const home=b.userData.home.clone(), above=CAULD.clone().add(new THREE.Vector3(.38,1.25,.1));
  anim(.55,t=>{ b.position.lerpVectors(home,above,ease(t)); b.position.y+=Math.sin(t*Math.PI)*.3; },()=>{
    sfx('pour');
    anim(.9,t=>{ b.rotation.z=Math.min(1,t*3)*2.1; if(t>.2&&t<.85) for(let i=0;i<2;i++) emit(b.position.clone().add(new THREE.Vector3(-.14,-.02,0)),{color:BOTTLES[c],vel:[-.5,-1.2,0],spread:.15,life:.45,size:.045,grav:3}); },()=>{
      checkMix(c);
      anim(.5,t=>{ b.rotation.z=2.1*(1-ease(t)); b.position.lerpVectors(above,home,ease(t)); },()=>{ b.position.copy(home); b.rotation.z=0; busy=false; });
    });
  });
}
function checkMix(c){
  S.mix.push(c);
  const ok=S.mix.every((x,i)=>x===FORMULA[i]);
  for(let i=0;i<12;i++) emit(CAULD.clone().add(new THREE.Vector3((Math.random()-.5)*.6,.8,(Math.random()-.5)*.6)),{color:BOTTLES[c],vel:[0,.8,0],spread:.4,life:.7,size:.06});
  if(!ok){ sfx('puff'); S.mix=[]; save(); setLiquid();
    for(let i=0;i<40;i++) emit(CAULD.clone().add(new THREE.Vector3((Math.random()-.5)*.5,.9,(Math.random()-.5)*.5)),{color:0x9a9aa8,normal:true,vel:[0,1.3,0],spread:1,life:1.6,size:.25,grow:.6,op:.7});
    toast('¡PUF! 💨 La mezcla explotó. Empieza otra vez.'); return; }
  setLiquid(); save();
  if(S.mix.length===FORMULA.length){ S.f.portal=1; save(); sfx('magic');
    for(let i=0;i<60;i++) emit(CAULD.clone().add(new THREE.Vector3(0,.9,0)),{color:i%2?0xc58bff:0xffffff,vel:[0,2,0],spread:1.6,life:1.4,size:.07});
    setTimeout(()=>{ showPortal(true); setTimeout(()=>say('🌀 ¡Se abrió un portal!','La mezcla brilló y en la pared del fondo apareció un remolino de luz. Algo de mí está del otro lado…'),1000); },500); }
}

function rockGeo(R,k,seed){ const g=new THREE.IcosahedronGeometry(R,3); const p=g.attributes.position, v=new THREE.Vector3();
  for(let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); const n=Math.sin(v.x*2.1+seed)*Math.cos(v.z*1.7+seed*2)*Math.sin(v.y*2.3+seed); v.multiplyScalar(1+n*(v.y>0?.025:.16)); if(v.y<0) v.y*=1.7; p.setXYZ(i,v.x,v.y,v.z); }
  g.computeVertexNormals(); g.scale(1,k,1); return g; }

function forestCollide(p){ const R=.3;

    if(d2<R*R){ if(d2>1e-9){ const d=Math.sqrt(d2); p.x=qx+dx/d*R; p.z=qz+dz/d*R; } else { const o=[[p.x-r.x1,-1,0],[r.x2-p.x,1,0],[p.z-r.z1,0,-1],[r.z2-p.z,0,1]].sort((a,b)=>a[0]-b[0])[0]; if(o[1]) p.x=o[1]<0?r.x1-R:r.x2+R; else p.z=o[2]<0?r.z1-R:r.z2+R; } } }
  const dx=p.x, dz=p.z+5, d=Math.hypot(dx,dz); if(d>23.5){ p.x=dx/d*23.5; p.z=-5+dz/d*23.5; }
  if(p.z>17) p.z=17; }

function lightMush(i){ const m=MUSH[i]; note(m.f,.55); m.capM.emissiveIntensity=2.2;

function fHelp(t){ $('#focusHelp').innerHTML=t; }
function simonPlay(){ simon.busy=true; simon.idx=0; const seq=ROUNDS[simon.round]; fHelp(`🎶 Escucha la canción… (ronda ${simon.round+1}/3)`);
  seq.forEach((m,i)=>setTimeout(()=>{ if(focus==='mush') lightMush(m); },1000+i*700));
  setTimeout(()=>{ if(focus!=='mush') return; simon.busy=false; fHelp(`👆 Ahora tú: toca los hongos en el mismo orden (ronda ${simon.round+1}/3)`); },1000+seq.length*700); }
function tapMush(i){
  if(simon.busy||S.f.simon) return; lightMush(i);
  const seq=ROUNDS[simon.round];
  if(seq[simon.idx]!==i){ sfx('bad'); simon.busy=true; fHelp('🙉 ¡Ups! Esa no era… escucha otra vez'); setTimeout(()=>{ if(focus==='mush') simonPlay(); },1400); return; }
  simon.idx++;
  if(simon.idx===seq.length){ simon.round++; simon.busy=true;
    if(simon.round>=ROUNDS.length){ S.f.simon=1; save(); sfx('ok'); fHelp('✨ ¡Lo lograste! Las hadas están felices ✨');
      setTimeout(()=>{ MUSH.forEach((m,k)=>setTimeout(()=>lightMush(k),k*120)); },500);
      setTimeout(()=>{ exitFocus(); setTimeout(showEars,900); },2200); }
    else { sfx('ok'); fHelp('💖 ¡Muy bien! Viene una canción más larga…'); setTimeout(()=>{ if(focus==='mush') simonPlay(); },1500); } }
}

function dCollide(p,y){ const R=.3;

    setTimeout(()=>{ el.remove(); if(first) wakeRun(()=>modal(`<h2>🕹️ Cómo jugar</h2><p>👈 Arrastra el dedo en el lado <b>izquierdo</b> para caminar.</p><p>👉 Arrastra en el lado <b>derecho</b> para mirar.</p><p>👆 <b>Toca</b> las cosas para usarlas. Busca los brillitos ✦</p><p>🎒 Abajo está tu inventario: toca un objeto para elegirlo y luego toca donde lo quieres usar.</p><button class="btn" id="okHow">¡Listo!</button>`,b=>{ b.querySelector('#okHow').onclick=()=>{ closeModal(); toast('Estás en una casa extraña… hay una carta en el piso. ✉️',3500); }; })); },1200);
  };
  const nb=el.querySelector('#newB'); if(nb) nb.onclick=()=>{ try{localStorage.removeItem(KEY)}catch(e){} location.href=location.pathname; };
})();
